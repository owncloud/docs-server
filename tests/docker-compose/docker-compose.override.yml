# LOCAL TEST OVERRIDE — do NOT use in production.
#
# This file layers on top of the shipped example
# (modules/admin_manual/examples/installation/docker/docker-compose.yml) so the
# stack can be booted locally / in CI without public DNS or Let's Encrypt.
#
# It changes exactly one thing versus the shipped file: which certificate the
# TLS routers serve. The production example obtains real certificates from
# Let's Encrypt via the ACME TLS-ALPN-01 challenge, which requires the public
# hostnames to resolve to this host — not possible on a throwaway CI runner.
# Here each router's `tls.certresolver` label (set by the base file) is blanked
# and `tls=true` is pinned, so the routers stay TLS-enabled but serve Traefik's
# built-in self-signed certificate. (A router that still references a certresolver
# it cannot satisfy would fail to obtain a certificate.)
#
# Deliberately NOT overridden here:
#
#   * Traefik's `command:` list. Compose *replaces* list values rather than
#     merging them, so re-listing the flags would freeze a copy of the base
#     file's Traefik configuration and silently stop future flag changes from
#     reaching the CI-tested config. The base file's ACME flags are therefore
#     inherited as-is: defining a certresolver is harmless when no router
#     references it — Traefik never places an ACME order, and the routers above
#     serve TRAEFIK DEFAULT CERT.
#
#   * The Traefik `image:` tag. CI must exercise the same version the docs ship.
#
# The security-hardened topology (split networks, no DB/Redis host ports,
# Collabora admin allowlist, HSTS) is inherited unchanged from the base file.
# Compose merges these list-form labels by key, so the entries below override
# only the matching keys from the base file and leave the rest intact.
services:
  owncloud:
    labels:
      - traefik.http.routers.owncloud.tls=true
      - traefik.http.routers.owncloud.tls.certresolver=

  collabora:
    labels:
      - traefik.http.routers.collabora.tls=true
      - traefik.http.routers.collabora.tls.certresolver=
      - traefik.http.routers.collabora-admin.tls=true
      - traefik.http.routers.collabora-admin.tls.certresolver=
